services:
  - type: web
    name: life-hub-assistant
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: WEB_PASSWORD_HASH
        sync: false
      - key: WEB_SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL_TO
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_FROM_NAME
        value: Andrei's Life Hub Assistant
      - key: DAILY_BRIEFING_TIME
        value: "06:00"
      - key: UTC_OFFSET_HOURS
        value: "8"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: onboarding@resend.dev
